name: Monthly salary data refresh

on:
  schedule:
    # 02:00 UTC on the 1st of each month = noon AEST / 2pm AEDT
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Override the date used as TODAY (YYYY-MM-DD). Leave blank to use today.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      # Resolve the date — use the override if supplied, otherwise today in UTC.
      - name: Set date
        id: date
        run: |
          if [ -n "${{ inputs.date_override }}" ]; then
            echo "today=${{ inputs.date_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      # Substitute {{TODAY}} and load into a step output for the action.
      - name: Prepare prompt
        id: prompt
        run: |
          content=$(sed "s/{{TODAY}}/${{ steps.date.outputs.today }}/g" .github/prompts/update-salaries.md)
          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$content" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # claude-code-action handles Claude Code installation and execution.
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.content }}
          allowed_tools: 'Read,Edit,WebFetch,WebSearch'

      # create-pull-request is a no-op if data.js wasn't modified.
      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: refresh/${{ steps.date.outputs.today }}
          commit-message: "data: salary refresh ${{ steps.date.outputs.today }}"
          title: "Data refresh — ${{ steps.date.outputs.today }}"
          delete-branch: true
          body: |
            Automated monthly refresh of `data.js`.

            **Review checklist before merging**
            - [ ] Spot-check a few current rates against the linked source URLs
            - [ ] Any new EAs signed or approved since last run?
            - [ ] `ea.status` values still accurate?
            - [ ] `accessed` dates updated on sources the agent actually visited
            - [ ] `DATA_AS_OF` reflects today's date
            - [ ] Sources the agent couldn't reach are flagged in `ea.notes`, not silently updated

            Triggered by: `${{ github.event_name }}` · Date used: `${{ steps.date.outputs.today }}`
